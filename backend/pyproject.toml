[project]
name = "payscope-backend"
version = "0.1.0"
description = "Backend API for PayScope, an employee salary management application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "bcrypt>=4.1,<5.0",
    "pyjwt>=2.9,<3.0",
]
# `alembic` is a runtime dependency, not dev-only: applying migrations
# (`alembic upgrade head`) is a deployment-time operation (see
# docs/deployment.md), so it must be installed in the production/container
# image, not only in developer environments.

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a running PostgreSQL instance (opt-in, see backend/README.md)",
    "scale: exercises the ~10,000 employee dataset (opt-in, slow; see backend/README.md)",
]
addopts = "-m \"not postgres and not scale\""
