# Serves the built PayScope SPA (frontend/Dockerfile's serve stage).
#
# This SPA uses client-side routing (react-router's BrowserRouter, see
# src/App.tsx), so a request for a route like /employees/42 is not a real
# file on disk — it must fall back to index.html and let the app's router
# handle it, or a hard refresh / direct link on any non-root route would
# 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
